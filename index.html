<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SandBox-OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Área de Trabalho (Clicar nela vai fechar o Menu Iniciar) -->
    <div id="desktop" onclick="closeStartMenuOutside(event)">
        
        <!-- Ícones da Área de Trabalho -->
        <div class="shortcut" onclick="openApp('notepad')">
            <span class="shortcut-icon">N</span>
            <span>Bloco de Notas</span>
        </div>

        <div class="shortcut" onclick="openApp('settings')">
            <span class="shortcut-icon">S</span>
            <span>Configurações</span>
        </div>
        
        <!-- Janela: Bloco de Notas -->
        <div id="win-notepad" class="window" style="display: none; top: 15%; left: 20%; width: 400px; height: 300px;">
            <div class="window-drag-border border-top"></div>
            <div class="window-drag-border border-bottom"></div>
            <div class="window-drag-border border-left"></div>
            <div class="window-drag-border border-right"></div>
            <div class="window-resize-handle"></div>
            
            <div class="window-header" id="win-notepad-header">
                <span class="window-title">Bloco de Notas</span>
                <div class="window-controls">
                    <button onclick="minimizeApp('notepad')">🗕</button>
                    <button onclick="maximizeApp('notepad')">🗖</button>
                    <button class="close-btn" onclick="closeApp('notepad')">✕</button>
                </div>
            </div>
            <div class="window-content">
                <!-- Adicionado o evento oninput para salvar o texto digitado em tempo real -->
                <textarea id="notepad-textarea" oninput="saveNoteText()" placeholder="Digite suas anotações aqui..."></textarea>
            </div>
        </div>

        <!-- Janela: Configurações -->
        <div id="win-settings" class="window" style="display: none; top: 20%; left: 30%; width: 480px; height: 360px;">
            <div class="window-drag-border border-top"></div>
            <div class="window-drag-border border-bottom"></div>
            <div class="window-drag-border border-left"></div>
            <div class="window-drag-border border-right"></div>
            <div class="window-resize-handle"></div>

            <div class="window-header" id="win-settings-header">
                <span class="window-title">Configurações</span>
                <div class="window-controls">
                    <button onclick="minimizeApp('settings')">🗕</button>
                    <button onclick="maximizeApp('settings')">🗖</button>
                    <button class="close-btn" onclick="closeApp('settings')">✕</button>
                </div>
            </div>
            <div class="window-content settings-layout">
                <div class="settings-sidebar">
                    <button class="active">🖼️ Fundo</button>
                </div>
                <div class="settings-body">
                    <h3>Cor de Fundo</h3>
                    <p>Escolha uma cor ou restaure o papel de parede:</p>
                    <div class="color-picker-grid">
                        <div class="color-ball color-blue" onclick="changeBackground('#2a4d69')"></div>
                        <div class="color-ball color-purple" onclick="changeBackground('#4b357a')"></div>
                        <div class="color-ball color-dark" onclick="changeBackground('#1e1e1e')"></div>
                        <div class="color-ball color-green" onclick="changeBackground('#1e4620')"></div>
                        <div class="color-ball color-sunset" onclick="changeBackground('#b85d32')"></div>
                        <div class="color-ball color-default" onclick="changeBackground('image')"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MENU INICIAR (Oculto por padrão no estilo do OS) -->
        <div id="start-menu" class="start-menu-panel" style="display: none;">
            <div class="start-menu-header">
                <h4>SandBox-OS</h4>
            </div>
            <div class="start-menu-content">
                <div class="start-menu-item" onclick="openAppFromStart('notepad')">📝 Bloco de Notas</div>
                <div class="start-menu-item" onclick="openAppFromStart('settings')">⚙️ Configurações</div>
            </div>
            <div class="start-menu-footer">
                <button class="restart-btn" onclick="clearSystemData()">🔄 Reiniciar OS</button>
            </div>
        </div>

    </div>

    <!-- Barra de Tarefas -->
    <div id="taskbar">
        <!-- Evento onclick atualizado para alternar a exibição do menu iniciar -->
        <button id="start-menu-btn" onclick="toggleStartMenu(event)">🌟 Iniciar</button>
        <div id="taskbar-apps"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
